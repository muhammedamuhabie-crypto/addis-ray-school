<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied | Addis Ray Secondary School</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }
        .card {
            width: min(92%, 560px);
            padding: 42px 32px;
            text-align: center;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }
        .code {
            margin: 0;
            color: #b5122b;
            font-size: 64px;
            font-weight: 800;
        }
        h1 {
            margin: 8px 0 12px;
            font-size: 28px;
        }
        p {
            margin: 0 auto 26px;
            max-width: 440px;
            line-height: 1.6;
            color: #666;
        }
        a {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 8px;
            background: #b5122b;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { background: #8f0d22; }
        .school {
            margin-top: 24px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">403</p>
        <h1>Access Denied</h1>
        <p>You do not have permission to access this page or perform this action.</p>
        <a href="/">Return to Home</a>
        <div class="school">Addis Ray Secondary School</div>
    </main>
</body>
</html>
