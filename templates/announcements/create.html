{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h1>New Announcement</h1>
        <p>Share an important message with the school community.</p>
    </div>

    <a href="{% url 'announcement_list' %}" class="btn">
        Back to Announcements
    </a>
</div>

<div class="announcement-form-card">
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Announcement Title</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="200"
                placeholder="Enter announcement title"
                required
            >
        </div>

        <div class="form-group">
            <label>To</label>
            <input
                type="text"
                value="{{ audience }}"
                readonly
            >
            <small class="form-help">
                The audience is determined automatically from your role.
            </small>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="8"
                placeholder="Write your announcement here..."
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                {% for value, label in priorities %}
                    <option value="{{ value }}">
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <a href="{% url 'announcement_list' %}" class="btn">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Post Announcement
            </button>
        </div>
    </form>
</div>
{% endblock %}
