{% extends 'base.html' %}{% block heading %}Subjects{% endblock %}{% block content %}<div class="panel"><form method="post" class="inline-form">{% csrf_token %}{{ form.as_p }}<button class="btn btn-brand">Add Subject</button></form></div><div class="panel table-wrap"><table><thead><tr><th>Name</th><th>Code</th><th>Actions</th></tr></thead><tbody>{% for s in subjects %}<tr><td>{{ s.name }}</td><td>{{ s.code }}</td><td><a href="{% url 'edit_subject' s.pk %}" class="btn btn-brand">Edit</a> <form method="post" action="{% url 'delete_subject' s.pk %}" style="display:inline;" onsubmit="return confirm('Delete this subject?' );">{% csrf_token %}<button type="submit" class="btn btn-danger">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
